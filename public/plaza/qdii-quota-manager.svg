<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">额度管家应用预览</title>
  <desc id="desc">蓝色主题的QDII基金额度分配与定投计划界面</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071A34"/>
      <stop offset="1" stop-color="#16477B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4DA3FF"/>
      <stop offset="1" stop-color="#73D7F5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#001127" flood-opacity=".22"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1100" cy="60" r="230" fill="#2D7FD3" opacity=".18"/>
  <circle cx="70" cy="650" r="240" fill="#64C7FF" opacity=".1"/>

  <g transform="translate(56 44)">
    <rect width="1088" height="587" rx="28" fill="#F7FAFF" filter="url(#shadow)"/>

    <g transform="translate(34 28)">
      <rect width="44" height="44" rx="13" fill="#0D2A4E"/>
      <path d="M12 14h20M12 22h14M12 30h17" fill="none" stroke="url(#accent)" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="32" cy="30" r="5" fill="#7ED7FF"/>
      <text x="58" y="20" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#102A4C">额度管家</text>
      <text x="58" y="42" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#70839A">QDII 基金额度智能分配助手</text>
      <rect x="850" y="4" width="166" height="38" rx="19" fill="#E6F2FF"/>
      <text x="933" y="28" text-anchor="middle" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#1C69B7">每日持续补齐额度</text>
    </g>

    <g transform="translate(34 105)">
      <rect width="240" height="88" rx="16" fill="#EAF4FF"/>
      <text x="18" y="29" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#67819D">计划投入金额</text>
      <text x="18" y="63" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="750" fill="#12345B">¥ 1,000</text>

      <rect x="256" width="240" height="88" rx="16" fill="#EDF8F7"/>
      <text x="274" y="29" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#67819D">当前可申购基金</text>
      <text x="274" y="63" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="750" fill="#0B655E">8 只</text>

      <rect x="512" width="240" height="88" rx="16" fill="#FFF7E8"/>
      <text x="530" y="29" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#67819D">今日可投额度</text>
      <text x="530" y="63" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="750" fill="#B06F00">¥ 230</text>

      <rect x="768" width="252" height="88" rx="16" fill="#F1F0FF"/>
      <text x="786" y="29" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#67819D">预计完成时间</text>
      <text x="786" y="63" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="750" fill="#5147A8">5 天</text>
    </g>

    <g transform="translate(34 215)">
      <rect width="1020" height="330" rx="18" fill="#FFFFFF" stroke="#DDE8F4"/>
      <text x="22" y="32" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#173552">今日额度分配计划</text>
      <rect x="826" y="12" width="176" height="34" rx="17" fill="#0D2A4E"/>
      <text x="914" y="34" text-anchor="middle" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="650" fill="#7ED7FF">自动分配买入金额</text>

      <rect x="18" y="55" width="984" height="36" rx="8" fill="#F4F7FB"/>
      <g font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#70839A">
        <text x="34" y="78">QDII基金</text><text x="400" y="78">当前限额</text><text x="570" y="78">今日分配</text><text x="742" y="78">剩余计划</text><text x="910" y="78">状态</text>
      </g>

      <g font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#233D58">
        <text x="34" y="126" font-weight="650">全球科技指数基金 A</text><text x="400" y="126">¥ 50 / 日</text><text x="570" y="126" fill="#1C69B7" font-weight="650">¥ 50</text><text x="742" y="126">¥ 310</text><rect x="895" y="108" width="88" height="26" rx="13" fill="#EAF8F5"/><text x="939" y="126" text-anchor="middle" fill="#0B655E">可申购</text>
        <line x1="18" y1="148" x2="1002" y2="148" stroke="#E7EEF6"/>
        <g transform="translate(0 55)"><text x="34" y="126" font-weight="650">海外市场精选基金 C</text><text x="400" y="126">¥ 100 / 日</text><text x="570" y="126" fill="#1C69B7" font-weight="650">¥ 100</text><text x="742" y="126">¥ 420</text><rect x="895" y="108" width="88" height="26" rx="13" fill="#EAF8F5"/><text x="939" y="126" text-anchor="middle" fill="#0B655E">可申购</text></g>
        <line x1="18" y1="203" x2="1002" y2="203" stroke="#E7EEF6"/>
        <g transform="translate(0 110)"><text x="34" y="126" font-weight="650">纳斯达克指数基金 A</text><text x="400" y="126">¥ 80 / 日</text><text x="570" y="126" fill="#1C69B7" font-weight="650">¥ 80</text><text x="742" y="126">¥ 270</text><rect x="895" y="108" width="88" height="26" rx="13" fill="#FFF7E8"/><text x="939" y="126" text-anchor="middle" fill="#B06F00">限额中</text></g>
      </g>

      <rect x="18" y="282" width="984" height="32" rx="8" fill="#0D2A4E"/>
      <text x="34" y="303" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#D9E9FA">今日计划投入 ¥230 · 剩余 ¥770</text>
      <text x="984" y="303" text-anchor="end" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="650" fill="#7ED7FF">生成持续定投计划 →</text>
    </g>
  </g>
</svg>
