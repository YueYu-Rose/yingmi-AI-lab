<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">纳指管家应用预览</title>
  <desc id="desc">蓝色主题的纳斯达克100基金对比与组合工具界面</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071A34"/>
      <stop offset="1" stop-color="#153F73"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4DA3FF"/>
      <stop offset="1" stop-color="#7ED7FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#001127" flood-opacity=".22"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1080" cy="70" r="220" fill="#2D7FD3" opacity=".18"/>
  <circle cx="80" cy="640" r="230" fill="#64C7FF" opacity=".1"/>

  <g transform="translate(56 44)">
    <rect width="1088" height="587" rx="28" fill="#F7FAFF" filter="url(#shadow)"/>

    <g transform="translate(34 28)">
      <rect width="44" height="44" rx="13" fill="#0D2A4E"/>
      <path d="M13 29L20 21L26 25L34 14" fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="58" y="20" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#102A4C">纳指管家</text>
      <text x="58" y="42" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#70839A">纳斯达克 100 基金选择与组合助手</text>
      <rect x="862" y="4" width="154" height="38" rx="19" fill="#E6F2FF"/>
      <text x="939" y="28" text-anchor="middle" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600" fill="#1C69B7">自选组合  3 只</text>
    </g>

    <g transform="translate(34 105)">
      <rect width="240" height="88" rx="16" fill="#EAF4FF"/>
      <text x="18" y="29" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#67819D">可对比基金</text>
      <text x="18" y="63" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="750" fill="#12345B">25+</text>
      <text x="78" y="62" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#67819D">只纳指基金</text>

      <rect x="256" width="240" height="88" rx="16" fill="#EDF8F7"/>
      <text x="274" y="29" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#67819D">组合加权费率</text>
      <text x="274" y="63" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="750" fill="#0B655E">0.58%</text>

      <rect x="512" width="240" height="88" rx="16" fill="#F1F0FF"/>
      <text x="530" y="29" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#67819D">实测跟踪误差</text>
      <text x="530" y="63" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="750" fill="#5147A8">1.26%</text>

      <rect x="768" width="252" height="88" rx="16" fill="#EEF6FF"/>
      <text x="786" y="29" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#67819D">组合每日可投额度</text>
      <text x="786" y="63" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="750" fill="#185A9D">¥ 2,500</text>
    </g>

    <g transform="translate(34 215)">
      <rect width="1020" height="330" rx="18" fill="#FFFFFF" stroke="#DDE8F4"/>
      <text x="22" y="32" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="700" fill="#173552">纳指基金完整对比</text>
      <g transform="translate(656 14)">
        <rect width="104" height="30" rx="15" fill="#EAF4FF"/>
        <text x="52" y="20" text-anchor="middle" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#1C69B7">综合最优</text>
        <rect x="112" width="104" height="30" rx="15" fill="#F2F5F9"/>
        <text x="164" y="20" text-anchor="middle" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#61758B">大额定投</text>
        <rect x="224" width="104" height="30" rx="15" fill="#F2F5F9"/>
        <text x="276" y="20" text-anchor="middle" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#61758B">跟踪精度</text>
      </g>

      <rect x="18" y="55" width="984" height="36" rx="8" fill="#F4F7FB"/>
      <g font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="11" fill="#70839A">
        <text x="34" y="78">基金名称</text><text x="344" y="78">综合费率</text><text x="478" y="78">跟踪误差</text><text x="612" y="78">单日限额</text><text x="742" y="78">基金规模</text><text x="870" y="78">组合比例</text>
      </g>

      <g font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" fill="#233D58">
        <g transform="translate(0 0)"><text x="34" y="126" font-weight="650">纳斯达克100指数基金 A</text><text x="344" y="126">0.52%</text><text x="478" y="126">0.89%</text><text x="612" y="126">¥1,000</text><text x="742" y="126">36.8 亿</text><rect x="868" y="108" width="104" height="26" rx="13" fill="#E7F2FF"/><text x="920" y="126" text-anchor="middle" fill="#1C69B7">40%</text></g>
        <line x1="18" y1="148" x2="1002" y2="148" stroke="#E7EEF6"/>
        <g transform="translate(0 55)"><text x="34" y="126" font-weight="650">纳斯达克100指数基金 C</text><text x="344" y="126">0.61%</text><text x="478" y="126">1.05%</text><text x="612" y="126">¥500</text><text x="742" y="126">24.3 亿</text><rect x="868" y="108" width="104" height="26" rx="13" fill="#EAF8F5"/><text x="920" y="126" text-anchor="middle" fill="#0B655E">35%</text></g>
        <line x1="18" y1="203" x2="1002" y2="203" stroke="#E7EEF6"/>
        <g transform="translate(0 110)"><text x="34" y="126" font-weight="650">海外科技指数基金 A</text><text x="344" y="126">0.67%</text><text x="478" y="126">1.32%</text><text x="612" y="126">¥1,000</text><text x="742" y="126">18.6 亿</text><rect x="868" y="108" width="104" height="26" rx="13" fill="#F1F0FF"/><text x="920" y="126" text-anchor="middle" fill="#5147A8">25%</text></g>
      </g>

      <rect x="18" y="282" width="984" height="32" rx="8" fill="#0D2A4E"/>
      <text x="34" y="303" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" fill="#D9E9FA">组合摘要</text>
      <text x="984" y="303" text-anchor="end" font-family="Inter, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="650" fill="#7ED7FF">生成自建组合 →</text>
    </g>
  </g>
</svg>
